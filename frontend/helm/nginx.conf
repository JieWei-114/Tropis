server {
    # 8080 so nginx can run as a non-root user (ports <1024 need root)
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (Lighthouse "Best Practices" + hardening) ──────────
    # `always` so they're sent on error responses too. nginx does NOT inherit
    # server-level add_header into a location that declares its own — hence the
    # /assets/ block repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;                 # clickjacking
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content-Security-Policy: connect-src must list your API / WS / gRPC-Web
    # origins, which are per-environment — so this is a STARTER, tighten per deploy.
    # The index.html theme bootstrap is inline, hence 'unsafe-inline' on script;
    # swap for a nonce/hash to drop it. Uncomment and adapt:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.example.com wss://api.example.com; frame-ancestors 'none'; base-uri 'self'" always;

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — client-side routing
    location / {
        try_files $uri /index.html;
    }
}

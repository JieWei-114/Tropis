name: tropis

# Tiers. Services without a profile form the core: what the foundation needs
# to authenticate a user and publish an event (MongoDB, Redis, Pulsar, OPA,
# the mail sink). Every other capability sits behind a profile named after its
# responsibility, so a stack starts only what it uses:
#   relational  PostgreSQL            graph     Neo4j
#   search      Elasticsearch         olap      ClickHouse
#   objects     MinIO                 workflow  Temporal + its PostgreSQL
#   secrets     Vault + vault-init    kv-scale  Aerospike
#   kafka       Kafka (KRaft)         stream    Flink jobmanager/taskmanager
#   signing     Rust signing service
#   observability  OTel/Jaeger/Prometheus/Alertmanager/Grafana
#   tools          admin web UIs
# `make up` selects the profiles the backend currently requires; see the
# Makefile for the exact set. Admin UIs depend on their datastore with
# `required: false`, so enabling `tools` never fails validation when the
# datastore's own profile is off (the UI then simply has nothing to reach).
# Every published port binds to 127.0.0.1: the datastores run without
# authentication, so they must not be reachable from the network.

services:
  # ── MongoDB ────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: tropis_mongodb
    ports:
      - '127.0.0.1:27018:27017'
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongo_data:/data/db
      - ./mongo-rs-init.js:/docker-entrypoint-initdb.d/rs-init.js:ro
    environment:
      MONGO_INITDB_DATABASE: tropis
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'rs.status().ok']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Replica-set host fix (one-shot) ───────────────────────────────
  # Moves the single-node replica set from advertising `localhost:27017` to the
  # compose service name. mongo-rs-init.js has to seed `localhost` (the initdb
  # mongod is bound to loopback, so anything else fails its isSelf check), but a
  # set that advertises `localhost` is unusable by any client that performs
  # topology discovery: it resolves the member to its own container's loopback.
  # `mongo-express` is exactly that — it drops query options, so it cannot be
  # told `directConnection=true` — and crash-loops without this.
  #
  # Idempotent and safe to re-run: it exits immediately once the host is right.
  # Clients on the HOST still need `directConnection=true`, because `mongodb`
  # is a Docker-network name that does not resolve outside it.
  mongo-rs-reconfig:
    image: mongo:7
    container_name: tropis_mongo_rs_reconfig
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./mongo-rs-reconfig.js:/rs.js:ro
    command: >
      mongosh "mongodb://mongodb:27017/?directConnection=true"
      --quiet --file /rs.js
    restart: 'no'

  # ── Mongo Express (MongoDB web UI) ────────────────────────────────
  mongo-express:
    profiles: ['tools']
    image: mongo-express:latest
    container_name: tropis_mongo_express
    depends_on:
      mongo-rs-reconfig:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8085:8081' # Web UI → http://localhost:8085
    environment:
      # directConnection is required: mongod runs as a single-node replica set.
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/?directConnection=true
      ME_CONFIG_BASICAUTH: 'false'
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tropis_redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── CH-UI (ClickHouse web UI) ──────────────────────────────────────
  clickhouse-ui:
    profiles: ['tools']
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: tropis_clickhouse_ui
    depends_on:
      clickhouse:
        condition: service_started
        required: false
    ports:
      - '127.0.0.1:8124:3488' # Web UI → http://localhost:8124

  # ── ClickHouse ─────────────────────────────────────────────────────
  clickhouse:
    profiles: ['olap']
    image: clickhouse/clickhouse-server:24
    container_name: tropis_clickhouse
    ports:
      - '127.0.0.1:8123:8123' # HTTP interface (used by @clickhouse/client and JDBC)
      - '127.0.0.1:9000:9000' # Native binary protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/init-analytics.sql:/docker-entrypoint-initdb.d/01-analytics.sql:ro
      - ../clickhouse/init-tracking.sql:/docker-entrypoint-initdb.d/03-tracking.sql:ro
      - ../clickhouse/init-audit.sql:/docker-entrypoint-initdb.d/04-audit.sql:ro
    environment:
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://localhost:8123/ping || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Aerospike ──────────────────────────────────────────────────────
  aerospike:
    profiles: ['kv-scale']
    image: aerospike/aerospike-server:8.1.2.4
    container_name: tropis_aerospike
    ports:
      - '127.0.0.1:3000:3000' # Client service port
      - '127.0.0.1:3001:3001' # Fabric (intra-cluster)
      - '127.0.0.1:3003:3003' # Info (telnet admin)
    healthcheck:
      test: ['CMD-SHELL', 'asinfo -v status | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Neo4j (graph database) ─────────────────────────────────────────
  # Relationship-first queries (traversals, shortest paths, recommendations).
  # Bolt protocol on 7687 for drivers; the same image serves Neo4j Browser on
  # 7474, so no separate admin UI is needed → http://localhost:7474
  neo4j:
    profiles: ['graph']
    image: neo4j:5-community
    container_name: tropis_neo4j
    ports:
      - '127.0.0.1:7474:7474' # HTTP API + Neo4j Browser
      - '127.0.0.1:7687:7687' # Bolt (drivers connect here)
    environment:
      NEO4J_AUTH: neo4j/tropis_dev_password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Apache Kafka (KRaft, single node) ──────────────────────────────
  # One process acting as both broker and controller; no ZooKeeper.
  # Two client listeners because a broker hands clients the address to
  # reconnect to: host tools use localhost:9092, other containers use
  # kafka:19092. The controller listener stays internal (host 9093 is
  # Alertmanager's).
  kafka:
    profiles: ['kafka']
    image: apache/kafka:3.8.0
    container_name: tropis_kafka
    ports:
      - '127.0.0.1:9092:9092' # Kafka clients on the host
    environment:
      CLUSTER_ID: tropis-dev-kraft-cluster1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker: internal topics cannot be replicated more than once.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Apache Pulsar ──────────────────────────────────────────────────
  pulsar:
    image: apachepulsar/pulsar:3.3.0
    container_name: tropis_pulsar
    ports:
      - '127.0.0.1:6650:6650' # Pulsar binary protocol (clients connect here)
      - '127.0.0.1:8080:8080' # HTTP admin API + Flink Pulsar connector
    command: bin/pulsar standalone --no-functions-worker --no-stream-storage
    environment:
      PULSAR_MEM: '-Xms512m -Xmx1g -XX:MaxDirectMemorySize=512m'
      PULSAR_STANDALONE_USE_ZOOKEEPER: '1'
    volumes:
      - pulsar_data:/pulsar/data
    stop_grace_period: 60s
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:8080/admin/v2/brokers/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Pulsar Manager (Pulsar web UI) ────────────────────────────────
  pulsar-manager:
    profiles: ['tools']
    image: apachepulsar/pulsar-manager:v0.4.0
    container_name: tropis_pulsar_manager
    depends_on:
      pulsar:
        condition: service_healthy
    ports:
      - '127.0.0.1:9527:9527' # Web UI → http://localhost:9527
      - '127.0.0.1:7750:7750' # Backend API
    environment:
      SPRING_CONFIGURATION_FILE: /pulsar-manager/pulsar-manager/application.properties
    restart: unless-stopped

  # ── Flink JobManager ───────────────────────────────────────────────
  flink-jobmanager:
    profiles: ['stream']
    image: flink:1.18-scala_2.12-java11
    container_name: tropis_flink_jm
    ports:
      - '127.0.0.1:8081:8081' # Flink Web UI → http://localhost:8081
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    volumes:
      - flink_data:/opt/flink/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8081/overview || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Flink TaskManager ──────────────────────────────────────────────
  flink-taskmanager:
    profiles: ['stream']
    image: flink:1.18-scala_2.12-java11
    container_name: tropis_flink_tm
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: 4
    volumes:
      - flink_data:/opt/flink/data

  # ── grpcui (gRPC web UI) ───────────────────────────────────────────
  # Point-and-click gRPC client — discovers services via server reflection,
  # so no proto files needed. Requires the BACKEND running on the host
  # (`make dev`) with reflection on (default outside production); it exits
  # if the target is unreachable — just restart it once the backend is up.
  grpcui:
    profiles: ['tools']
    image: fullstorydev/grpcui:latest
    container_name: tropis_grpcui
    command: -plaintext -bind 0.0.0.0 -port 8080 host.docker.internal:50051
    ports:
      - '127.0.0.1:8083:8080' # Web UI → http://localhost:8083
    extra_hosts:
      - 'host.docker.internal:host-gateway' # Linux compat; no-op on Mac
    restart: unless-stopped

  # ── Jaeger (distributed tracing UI) ───────────────────────────────
  # Receives traces from OTel Collector and provides a search UI.
  # Open http://localhost:16686 to see every request traced through the app.
  #
  # How it connects:
  #   NestJS → OTel SDK → OTel Collector → Jaeger
  #
  # In the UI: search by service "tropis-backend", click any trace to see
  # exactly which MongoDB/Redis/Pulsar calls were made and how long each took.
  jaeger:
    profiles: ['observability']
    image: jaegertracing/all-in-one:1.56
    container_name: tropis_jaeger
    ports:
      - '127.0.0.1:16686:16686' # Jaeger UI
      - '127.0.0.1:14250:14250' # gRPC (OTel Collector sends traces here)
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

  # ── OpenTelemetry Collector ────────────────────────────────────────
  # Receives traces from NestJS (OTLP/HTTP :4318) and forwards to Jaeger.
  # Acts as a buffer/router — you can add more exporters (Prometheus, Datadog)
  # without changing the app code.
  otel-collector:
    profiles: ['observability']
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: tropis_otel
    depends_on:
      - jaeger
    ports:
      - '127.0.0.1:4317:4317' # OTLP gRPC receiver
      - '127.0.0.1:4318:4318' # OTLP HTTP receiver (NestJS sends here)
      - '127.0.0.1:8888:8888' # Prometheus metrics (self) — scraped by Prometheus
      - '127.0.0.1:8889:8889' # Prometheus exporter — NestJS metrics forwarded here
    volumes:
      - ../otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml

  # ── PostgreSQL + pgvector ──────────────────────────────────────────
  # PostgreSQL with the pgvector extension for semantic / similarity search.
  # Use-case: store embedding vectors alongside relational data, run
  # cosine/L2 similarity queries (ANN search) without a separate vector DB.
  postgres:
    profiles: ['relational']
    image: pgvector/pgvector:pg16
    container_name: tropis_postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: tropis
      POSTGRES_PASSWORD: tropis_dev_password
      POSTGRES_DB: tropis
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tropis -d tropis']
      interval: 5s
      timeout: 3s
      retries: 20

  # ── pgAdmin (PostgreSQL web UI) ────────────────────────────────────
  pgadmin:
    profiles: ['tools']
    image: dpage/pgadmin4:latest
    container_name: tropis_pgadmin
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    ports:
      - '127.0.0.1:5050:80' # Web UI → http://localhost:5050
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Elasticsearch ──────────────────────────────────────────────────
  # Full-text search + structured queries. Use-case: power search bars,
  # faceted filters, log/event search (complementary to ClickHouse aggregates).
  elasticsearch:
    profiles: ['search']
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: tropis_elasticsearch
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ── Kibana (Elasticsearch web UI) ─────────────────────────────────
  kibana:
    profiles: ['tools']
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: tropis_kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
        required: false
    ports:
      - '127.0.0.1:5601:5601' # Web UI → http://localhost:5601
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: 'false'
      TELEMETRY_ENABLED: 'false'

  # ── MinIO (S3-compatible object storage) ──────────────────────────
  # Store file uploads, images, exports. API is 100% compatible with AWS S3
  # SDK, so swapping to real S3 in production requires zero code changes.
  # MinIO no longer publishes community images (minio/minio is gone from
  # Docker Hub); pgsty/minio rebuilds the same server from source.
  minio:
    profiles: ['objects']
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: tropis_minio
    ports:
      - '127.0.0.1:9900:9000' # S3 API (avoid conflict with Pulsar's 9000)
      - '127.0.0.1:9902:9902' # MinIO Console UI → http://localhost:9902
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9902"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Mailpit (dev SMTP trap) ────────────────────────────────────────
  # Catches all outbound email in dev — no real emails are sent.
  # Open http://localhost:8025 to browse received messages.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: tropis_mailpit
    ports:
      - '127.0.0.1:1025:1025' # SMTP (NestJS/Nodemailer sends here)
      - '127.0.0.1:8025:8025' # Web UI + API → http://localhost:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── HashiCorp Vault ────────────────────────────────────────────────
  # Secret management — stores all app credentials (DB passwords, API keys, JWT secrets).
  # Dev mode: auto-unsealed, root token = "dev-root-token", data is in-memory (wiped on restart).
  # Web UI → http://localhost:8200  (token: dev-root-token)
  #
  # On first start the entrypoint script seeds all secrets into the KV store at:
  #   secret/tropis  — all application secrets
  #   secret/tropis/db, secret/tropis/messaging, etc. — grouped paths
  vault:
    profiles: ['secrets']
    image: hashicorp/vault:1.17
    container_name: tropis_vault
    ports:
      - '127.0.0.1:8200:8200' # Vault API + Web UI → http://localhost:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK # Vault needs this to prevent secrets being swapped to disk
    command: vault server -dev -dev-root-token-id=dev-root-token
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "vault status -address=http://127.0.0.1:8200 | grep -q 'Sealed.*false'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Vault Init (seeds secrets on first run) ────────────────────────
  # One-shot container that runs the init script then exits.
  # Waits for Vault to be healthy before writing secrets.
  vault-init:
    profiles: ['secrets']
    image: hashicorp/vault:1.17
    container_name: tropis_vault_init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    volumes:
      - ../vault:/vault-init:ro
    command: sh /vault-init/init.sh
    restart: on-failure

  # ── RedisInsight (Redis web UI) ────────────────────────────────────
  redisinsight:
    profiles: ['tools']
    image: redis/redisinsight:latest
    container_name: tropis_redisinsight
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:5540:5540' # Web UI → http://localhost:5540

  # ── Dozzle (Docker container log viewer) ───────────────────────────
  # Live tail + search across all local containers, zero config.
  dozzle:
    profiles: ['tools']
    image: amir20/dozzle:latest
    container_name: tropis_dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '127.0.0.1:9999:8080' # Web UI → http://localhost:9999 (8888 taken by otel)

  # ── Prometheus ─────────────────────────────────────────────────────
  # Scrapes metrics from OTel Collector (8889) and the backend ops port (9464/metrics).
  # Source of truth for all numeric time-series data fed into Grafana.
  prometheus:
    profiles: ['observability']
    image: prom/prometheus:v2.51.2
    container_name: tropis_prometheus
    # prometheus.yml scrapes the host-run backend at host.docker.internal:9464,
    # which Linux does not resolve without this mapping (same as grpcui).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:9090:9090' # Prometheus UI + query API
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  # ── Alertmanager ───────────────────────────────────────────────────
  # Receives alerts from Prometheus (see `alerting:` in prometheus.yml)
  # and routes them to Slack / webhooks — config in ../prometheus/alertmanager.yml.
  alertmanager:
    profiles: ['observability']
    image: prom/alertmanager:v0.27.0
    container_name: tropis_alertmanager
    ports:
      - '127.0.0.1:9093:9093' # Alertmanager UI + API
    volumes:
      - ../prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    restart: unless-stopped

  # ── OPA (Open Policy Agent) ───────────────────────────────────────
  # Centralised policy engine — NestJS asks OPA "can role X do action Y?"
  # instead of hardcoding rules in application code.
  # REST API → http://localhost:8181. Token authentication: every call but
  # the GET /health probe needs `Authorization: Bearer $OPA_TOKEN`
  # (infra/opa/system_authz.rego); the backend sends its OPA_TOKEN, which
  # must match.
  opa:
    build:
      context: ../..
      dockerfile: infra/opa/Dockerfile
    image: tropis/opa:dev
    container_name: tropis_opa
    ports:
      - '127.0.0.1:8181:8181' # OPA REST API
    environment:
      OPA_TOKEN: '${OPA_TOKEN:-tropis-dev-opa-token}'
    volumes:
      - ../opa:/policies:ro
    command: run --server --addr 0.0.0.0:8181 --authentication=token --authorization=basic --log-format=json --log-level=info /policies
    restart: unless-stopped

  # ── Temporal (workflow orchestration) ────────────────────────────
  # Durable workflow engine — handles retries, timeouts, signals, and
  # long-running multi-step processes that BullMQ cannot model easily.
  # Web UI → http://localhost:8233
  temporal:
    profiles: ['workflow']
    image: temporalio/auto-setup:1.24
    container_name: tropis_temporal
    depends_on:
      postgresql-temporal:
        condition: service_healthy
    ports:
      - '127.0.0.1:7233:7233' # Temporal gRPC frontend (clients + workers connect here)
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql-temporal
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
    volumes:
      - ../temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'tctl --address "$$(hostname -i):7233" cluster health | grep -q SERVING',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  temporal-ui:
    profiles: ['tools']
    image: temporalio/ui:2.26.2
    container_name: tropis_temporal_ui
    depends_on:
      temporal:
        condition: service_healthy
        required: false
    ports:
      - '127.0.0.1:8233:8080' # Web UI → http://localhost:8233
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: 'http://localhost:5173'
    restart: unless-stopped

  # Dedicated PostgreSQL for Temporal (keeps it isolated from app DB)
  postgresql-temporal:
    profiles: ['workflow']
    image: postgres:16-alpine
    container_name: tropis_temporal_postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal -d temporal']
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Grafana ────────────────────────────────────────────────────────
  # Visualizes Prometheus metrics and Jaeger traces in dashboards.
  # Default login: admin / admin  →  http://localhost:3000
  # Note: host port 3000 — ensure NestJS runs on 3100 (default in .env).
  grafana:
    profiles: ['observability']
    image: grafana/grafana:10.4.2
    container_name: tropis_grafana
    depends_on:
      - prometheus
    ports:
      - '127.0.0.1:3101:3000' # Grafana UI → http://localhost:3101  (3000 taken by Aerospike, 3001 by Aerospike fabric)
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource

  # ── Metabase (BI / self-serve analytics UI) ────────────────────────
  # Dashboards + ad-hoc questions over ClickHouse tracking data.
  # First-run setup (one-time, via the UI at http://localhost:3200):
  #   Admin → Databases → Add database → ClickHouse
  #     host: clickhouse, port: 8123, database: logs, user: default (no password)
  #   (Metabase bundles a native ClickHouse driver in recent versions —
  #   official since v0.50; no plugin jar needed.)
  # Reference queries to recreate as questions: infra/clickhouse/queries/.
  # App state (dashboards, users) persists in the H2 file on metabase_data.
  metabase:
    profiles: ['tools']
    image: metabase/metabase:latest
    container_name: tropis_metabase
    depends_on:
      clickhouse:
        condition: service_started
        required: false
    ports:
      - '127.0.0.1:3200:3000' # Web UI → http://localhost:3200 (host 3000 taken by Aerospike)
    environment:
      MB_DB_TYPE: h2 # embedded app DB — fine for local dev
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    restart: unless-stopped

  # ── Signing (Rust gRPC — HMAC request signatures) ──────────────────
  # Stateless polyglot example service (services/rust/signing/). Contract:
  # proto/signing/v1/signing.proto; scheme: docs/api-conventions.md.
  signing:
    profiles: ['signing']
    build:
      context: ../.. # repo root — build needs proto/
      dockerfile: services/rust/signing/Dockerfile
    container_name: tropis_signing
    ports:
      - '127.0.0.1:50052:50052'
    environment:
      GRPC_PORT: 50052
      API_KEYS: '${API_KEYS:-{}}' # JSON map {keyId: {secret, tenantId}}, same as backend
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  clickhouse_data:
  pulsar_data:
  flink_data:
  postgres_data:
  pgadmin_data:
  es_data:
  minio_data:
  prometheus_data:
  grafana_data:
  temporal_postgres_data:
  metabase_data:
  neo4j_data:
  kafka_data:

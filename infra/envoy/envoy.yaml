admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address: { address: 0.0.0.0, port_value: 8090 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: auto
                stat_prefix: ingress_grpc_web
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ['*']
                      routes:
                        - match: { prefix: '/' }
                          route:
                            cluster: grpc_backend
                            timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          # Pinned origins. A ".*" wildcard here lets ANY page a victim
                          # visits script authenticated gRPC-Web calls against this tier
                          # and read the responses. Never widen this back to a catch-all.
                          #
                          # Envoy does NOT expand environment variables or ${...} in its
                          # static bootstrap, so production origins cannot be injected at
                          # runtime — they have to be present in the file the deployment
                          # mounts. BEFORE DEPLOYING, uncomment the production block below
                          # and replace `yourdomain.com` with the real apex domain (same
                          # placeholder convention as infra/k8s/overlays/*/ingress.yaml and
                          # the CORS_ORIGIN literal in infra/k8s/overlays/prod/kustomization.yaml).
                          # Leaving it commented out means every browser call from
                          # production is rejected by CORS — that is the intended
                          # fail-closed default, not a silent wildcard.
                          allow_origin_string_match:
                            # --- local development (safe to keep in every environment) ---
                            - exact: 'http://localhost:5173' # helm console (vite dev)
                            - exact: 'http://localhost:4173' # helm console (vite preview)
                            - exact: 'http://localhost:3000' # harbor site (next dev)
                            # --- packaged clients (fixed custom schemes, not deployment
                            #     settings): the Tauri desktop shell and the two
                            #     Capacitor apps do not serve from a network origin, so
                            #     without these every gRPC-Web call from them is blocked
                            #     and each app fails at sign-in ---
                            - exact: 'tauri://localhost' # desktop (macOS, Linux)
                            - exact: 'http://tauri.localhost' # desktop (Windows)
                            - exact: 'capacitor://localhost' # iOS
                            - exact: 'http://localhost' # Android (default scheme)
                            - exact: 'https://localhost' # Android (androidScheme: https)
                            # --- production: uncomment and replace before deploying ---
                            # - exact: 'https://app.yourdomain.com' # ← replace (helm console)
                            # - exact: 'https://yourdomain.com' # ← replace (harbor site, apex)
                            # - exact: 'https://www.yourdomain.com' # ← replace (harbor site, www)
                          allow_methods: GET, PUT, DELETE, POST, OPTIONS
                          allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization,x-request-id,x-tenant-id
                          max_age: '1728000'
                          expose_headers: grpc-status,grpc-message,grpc-encoding,grpc-accept-encoding
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: grpc_backend
      connect_timeout: 1s
      type: logical_dns
      dns_lookup_family: V4_ONLY
      http2_protocol_options: {}
      lb_policy: round_robin
      load_assignment:
        cluster_name: grpc_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 50051

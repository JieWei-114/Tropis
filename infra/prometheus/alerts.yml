groups:
  - name: availability
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Instance {{ $labels.instance }} (job {{ $labels.job }}) is down'
          description: 'Prometheus has been unable to scrape {{ $labels.instance }} for more than 2 minutes.'

  - name: nodejs-runtime
    rules:
      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds{job="nestjs"} > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High event-loop lag on {{ $labels.instance }}'
          description: 'p99 event-loop lag is {{ $value | humanizeDuration }} (> 200ms) for 5 minutes. The Node.js process is likely CPU-bound or blocked.'

      - alert: HighHeapUsage
        expr: nodejs_heap_size_used_bytes{job="nestjs"} / nodejs_heap_size_total_bytes{job="nestjs"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Heap usage above 90% on {{ $labels.instance }}'
          description: 'V8 heap used is {{ $value | humanizePercentage }} of total heap for 5 minutes — risk of GC thrash / OOM.'

      - alert: HighResidentMemory
        expr: process_resident_memory_bytes{job="nestjs"} > 1.5e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'RSS above 1.5 GiB on {{ $labels.instance }}'
          description: 'Resident memory is {{ $value | humanize1024 }}B for 10 minutes.'

  - name: http
    rules:
      - alert: HighHttp5xxRate
        expr: |
          sum(rate(tropis_http_server_requests_total{job="nestjs", status_class="5xx"}[5m]))
            /
          sum(rate(tropis_http_server_requests_total{job="nestjs"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'HTTP 5xx error rate above 5%'
          description: '{{ $value | humanizePercentage }} of requests are failing with 5xx over the last 5 minutes.'

      - alert: HighHttpLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(tropis_http_server_duration_seconds_bucket{job="nestjs"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'HTTP p95 latency above 1s'
          description: 'p95 request duration is {{ $value | humanizeDuration }} over the last 5 minutes.'

  - name: rpc
    rules:
      - alert: HighRpcServerErrorRate
        expr: |
          sum(rate(tropis_rpc_server_requests_total{job="nestjs", code=~"unknown|internal|unavailable|data_loss|deadline_exceeded|unimplemented"}[5m]))
            /
          sum(rate(tropis_rpc_server_requests_total{job="nestjs"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'RPC server error rate above 5%'
          description: '{{ $value | humanizePercentage }} of RPC calls ended with a server-side Connect code over the last 5 minutes.'

      - alert: HighRpcLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(tropis_rpc_server_duration_seconds_bucket{job="nestjs"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'RPC p95 latency above 1s'
          description: 'p95 RPC call duration is {{ $value | humanizeDuration }} over the last 5 minutes.'

  - name: jobs
    rules:
      - alert: JobsDeadLettered
        expr: sum by (queue) (increase(tropis_jobs_dead_lettered_total{job="nestjs"}[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Jobs of {{ $labels.queue }} exhausted their retries'
          description: '{{ $value }} job(s) moved to the dead-letter queue in the last 10 minutes. Inspect and replay them with the devtools jobs-dlq tool once the cause is fixed.'

  - name: outbox
    rules:
      - alert: OutboxDeadRows
        expr: tropis_outbox_backlog_rows{job="nestjs", status="dead"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox has {{ $value }} dead-lettered row(s)'
          description: 'Rows reached the terminal DEAD status after exhausting all publish attempts — those domain events will NEVER be delivered without manual intervention, so downstream read models (Elasticsearch, pgvector, ClickHouse) are permanently out of sync. Each DEAD row also blocks every later event of its aggregate. List them with `make outbox-dead` and read lastError to find the failing topic, then `make outbox-redrive` once the cause is fixed, or `make outbox-skip` to give the event up.'

      - alert: OutboxFailedBacklogSustained
        expr: min_over_time(tropis_outbox_backlog_rows{job="nestjs", status="failed"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox FAILED backlog has not cleared in 30 minutes'
          description: '{{ $value }} row(s) have been stuck in FAILED for half an hour, meaning the exponential retry backoff is not winning — the broker or a topic is rejecting publishes. Rows in this state also hold back every later event for the same aggregate. They become DEAD after 5 attempts; check the relay error logs and Pulsar health now.'

      - alert: OutboxPendingBacklogGrowing
        expr: min_over_time(tropis_outbox_backlog_rows{job="nestjs", status="pending"}[10m]) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox PENDING backlog above 100 and not draining'
          description: 'Each relay poll publishes up to 50 aggregates and polls again at once after a full batch (otherwise every 5 seconds), so a floor of {{ $value }} PENDING rows over 10 minutes means the relays are not keeping up or not running. Check OutboxRelayStalled, the per-aggregate leases in Redis, and whether writes are outpacing the relays.'

      - alert: OutboxRelayStalled
        expr: time() - max(tropis_outbox_relay_last_poll_timestamp_seconds{job="nestjs"}) > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Outbox relay has not polled for over a minute'
          description: 'No relay instance has polled for more than 60 seconds (each polls at least every 5s). Nothing is being published: every domain event is piling up as PENDING. Check that the backend is running and the relay logs for outbox.relay-poll-failed and outbox.relay-lock-unavailable (Redis unreachable, so no aggregate lease can be taken).'

  - name: messaging
    rules:
      - alert: ConsumerDeadLettering
        expr: sum by (system, destination, subscription) (increase(tropis_messaging_dead_lettered_total{job="nestjs"}[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Consumer {{ $labels.subscription }} dead-lettered messages from {{ $labels.destination }}'
          description: '{{ $value }} message(s) failed every redelivery in the last 10 minutes and went to {{ $labels.destination }}-DLQ ({{ $labels.system }}). Covers Kafka too, whose DLQ the broker metrics do not show. Check the handler error logs, then inspect and redrive with `make messaging-dlq`.'

      - alert: ConsumerFailureRateHigh
        expr: sum by (subscription) (rate(tropis_messaging_failed_total{job="nestjs"}[5m])) / clamp_min(sum by (subscription) (rate(tropis_messaging_processed_total{job="nestjs"}[5m]) + rate(tropis_messaging_failed_total{job="nestjs"}[5m])), 1e-9) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Consumer {{ $labels.subscription }} fails over 20% of attempts'
          description: 'A sink the consumer writes to is failing or rejecting; messages are being redelivered with backoff and will be dead-lettered if it lasts.'

      - alert: PulsarDeadLetterBacklog
        expr: pulsar_msg_backlog{job="pulsar", topic=~".*-DLQ"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Pulsar dead-letter topic {{ $labels.topic }} has a backlog'
          description: '{{ $value }} message(s) sit in {{ $labels.topic }}, kept for its `<subscription>-DLQ` subscription. A consumer failed the same message on every redelivery (MESSAGING_MAX_REDELIVERIES, backing off up to MESSAGING_MAX_REDELIVERY_DELAY_MS) and it was routed here instead of blocking the subscription — the work in it was never done. Inspect it with `make messaging-dlq` and redrive it once the handler is fixed.'

      - alert: PulsarDeadLetterRateHigh
        expr: sum by (topic) (rate(pulsar_in_messages_total{job="pulsar", topic=~".*-DLQ"}[10m])) > 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'Messages are entering {{ $labels.topic }} continuously'
          description: 'Dead-lettering at {{ $value }} msg/s over 10 minutes is not one poison message — a consumer handler is failing broadly (bad deploy, a down sink). Fix the handler before the backlog grows past what is practical to replay.'

groups:
  - name: availability
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Instance {{ $labels.instance }} (job {{ $labels.job }}) is down'
          description: 'Prometheus has been unable to scrape {{ $labels.instance }} for more than 2 minutes.'

  - name: nodejs-runtime
    rules:
      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds{job="nestjs"} > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High event-loop lag on {{ $labels.instance }}'
          description: 'p99 event-loop lag is {{ $value | humanizeDuration }} (> 200ms) for 5 minutes. The Node.js process is likely CPU-bound or blocked.'

      - alert: HighHeapUsage
        expr: nodejs_heap_size_used_bytes{job="nestjs"} / nodejs_heap_size_total_bytes{job="nestjs"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Heap usage above 90% on {{ $labels.instance }}'
          description: 'V8 heap used is {{ $value | humanizePercentage }} of total heap for 5 minutes — risk of GC thrash / OOM.'

      - alert: HighResidentMemory
        expr: process_resident_memory_bytes{job="nestjs"} > 1.5e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'RSS above 1.5 GiB on {{ $labels.instance }}'
          description: 'Resident memory is {{ $value | humanize1024 }}B for 10 minutes.'

  - name: http
    rules:
      - alert: HighHttp5xxRate
        expr: |
          sum(rate(http_requests_total{job="nestjs", status_code=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="nestjs"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'HTTP 5xx error rate above 5%'
          description: '{{ $value | humanizePercentage }} of requests are failing with 5xx over the last 5 minutes.'

      - alert: HighHttpLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="nestjs"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'HTTP p95 latency above 1s'
          description: 'p95 request duration is {{ $value | humanizeDuration }} over the last 5 minutes.'

  - name: outbox
    rules:
      - alert: OutboxDeadRows
        expr: tropis_outbox_rows{job="nestjs", status="dead"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox has {{ $value }} dead-lettered row(s)'
          description: 'Rows reached the terminal DEAD status after exhausting all publish attempts — those domain events will NEVER be delivered without manual intervention, so downstream read models (Elasticsearch, pgvector, ClickHouse) are permanently out of sync. Query the outbox collection for status "dead" and read lastError to find the failing topic, then replay the rows once the cause is fixed.'

      - alert: OutboxFailedBacklogSustained
        expr: min_over_time(tropis_outbox_rows{job="nestjs", status="failed"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox FAILED backlog has not cleared in 30 minutes'
          description: '{{ $value }} row(s) have been stuck in FAILED for half an hour, meaning the exponential retry backoff is not winning — the broker or a topic is rejecting publishes. Rows in this state also hold back every later event for the same aggregate. They become DEAD after 5 attempts; check the relay error logs and Pulsar health now.'

      - alert: OutboxPendingBacklogGrowing
        expr: min_over_time(tropis_outbox_rows{job="nestjs", status="pending"}[10m]) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox PENDING backlog above 100 and not draining'
          description: 'The relay publishes 50 rows every 5 seconds, so a floor of {{ $value }} PENDING rows over 10 minutes means it is not keeping up or not running. Check OutboxRelayStalled, the relay Redis lock, and whether writes are outpacing the batch size.'

      - alert: OutboxRelayStalled
        expr: time() - max(tropis_outbox_relay_last_poll_timestamp_seconds{job="nestjs"}) > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Outbox relay has not polled for over a minute'
          description: 'No instance has acquired the outbox relay lock for more than 60 seconds (it should poll every 5s). Nothing is being published: every domain event is piling up as PENDING. Usual cause is Redis being unreachable, so the lock can never be taken — check Redis and the relay logs for "lock unavailable".'

  - name: messaging
    rules:
      - alert: PulsarDeadLetterBacklog
        expr: pulsar_msg_backlog{job="pulsar", topic=~".*-DLQ"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Pulsar dead-letter topic {{ $labels.topic }} has a backlog'
          description: '{{ $value }} message(s) sit in {{ $labels.topic }}. A consumer failed the same message 5 times (maxRedeliverCount in pulsar-broker.adapter.ts) and it was routed here instead of blocking the subscription — the work in it was never done. Inspect the payloads and the handler error logs for the parent topic.'

      - alert: PulsarDeadLetterRateHigh
        expr: sum by (topic) (rate(pulsar_in_messages_total{job="pulsar", topic=~".*-DLQ"}[10m])) > 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'Messages are entering {{ $labels.topic }} continuously'
          description: 'Dead-lettering at {{ $value }} msg/s over 10 minutes is not one poison message — a consumer handler is failing broadly (bad deploy, a down sink). Fix the handler before the backlog grows past what is practical to replay.'

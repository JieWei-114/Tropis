global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml # resolved relative to this file (/etc/prometheus in the container)

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093'] # compose service (observability profile)

scrape_configs:
  # Backend metrics from the ops port every role serves (OPS_PORT, 9464),
  # never the public HTTP port. Locally one `all` process; in a cluster every
  # role's pods (prometheus.io/* annotations in infra/k8s/base/backend/).
  - job_name: nestjs
    static_configs:
      - targets: ['host.docker.internal:9464']
    metrics_path: /metrics

  # OTel Collector self-metrics
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  # OTel Collector Prometheus exporter (forwarded app metrics)
  - job_name: otel-app-metrics
    static_configs:
      - targets: ['otel-collector:8889']

  # Pulsar broker metrics — topic-level series, including the `-DLQ` topics the
  # broker adapter's deadLetterPolicy creates.
  - job_name: pulsar
    static_configs:
      - targets: ['pulsar:8080'] # compose service, admin/metrics port

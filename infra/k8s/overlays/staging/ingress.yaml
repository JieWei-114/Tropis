apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    # Same issuer as prod — staging still gets real certificates so the full
    # TLS path is exercised before a prod deploy. Switch to
    # letsencrypt-staging if you hit LE rate limits.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.yourdomain.com # ← replace
        - api.staging.yourdomain.com # ← replace
      secretName: tropis-staging-tls-cert
  rules:
    # Frontend
    - host: staging.yourdomain.com # ← replace
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
    # Backend API + WebSocket
    - host: api.staging.yourdomain.com # ← replace
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 3100

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests shared across all environments
resources:
  - ../../base
  - hpa.yaml
  - ingress.yaml

# Image tag is set by CI to the git tag (e.g. v1.2.3)
# Run, for each backend role (public, private, worker, scheduler):
#   kustomize edit set image ghcr.io/tropis/backend-<role>=ghcr.io/tropis/backend-<role>:$(git describe --tags)
images:
  - name: ghcr.io/tropis/backend-public
    newTag: latest # overwritten by CI: kustomize edit set image ...
  - name: ghcr.io/tropis/backend-private
    newTag: latest # overwritten by CI: kustomize edit set image ...
  - name: ghcr.io/tropis/backend-worker
    newTag: latest # overwritten by CI: kustomize edit set image ...
  - name: ghcr.io/tropis/backend-scheduler
    newTag: latest # overwritten by CI: kustomize edit set image ...
  - name: ghcr.io/tropis/frontend
    newTag: latest # overwritten by CI: kustomize edit set image ...
  - name: ghcr.io/tropis/harbor
    newTag: latest # overwritten by CI: kustomize edit set image ...

# Prod-specific config overrides (merged on top of base ConfigMap)
configMapGenerator:
  - name: backend-config
    namespace: tropis
    behavior: merge
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=warn
      # Browser origins allowed to call the API: a comma-separated list of
      # absolute URLs (validated in env.validation.ts, split in cors.constants.ts).
      - CORS_ORIGIN=https://app.yourdomain.com # ← replace
      - KEYSPACE_ENV=production
      # Set by deploy-prod.yml to the released image tag.
      - SERVICE_VERSION=unreleased

# Fixed replica counts for the roles without an HPA.
patches:
  # HPA targets (hpa.yaml) carry no replica count, so an apply never resets
  # the HPA's choice. The base keeps one for clusters without an HPA.
  - target:
      kind: Deployment
      name: backend-public|backend-worker|frontend
    patch: |-
      - op: remove
        path: /spec/replicas
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend-private
        namespace: tropis
      spec:
        replicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: harbor
        namespace: tropis
      spec:
        replicas: 2

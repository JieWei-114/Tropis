apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: tropis
  annotations:
    # cert-manager issues a Let's Encrypt TLS certificate automatically
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # NGINX-specific — remove if using a different ingress controller
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    # Avatar uploads are up to 5 MB; ingress-nginx's default body limit is 1 MB.
    nginx.ingress.kubernetes.io/proxy-body-size: '6m'
spec:
  ingressClassName: nginx # change to alb / traefik if using a different controller
  tls:
    - hosts:
        - yourdomain.com # ← replace (public site — harbor)
        - www.yourdomain.com # ← replace (public site — harbor)
        - app.yourdomain.com # ← replace (admin console — helm)
        - api.yourdomain.com # ← replace
        - rpc.yourdomain.com # ← replace (browser RPC endpoint, Connect protocol)
      secretName: app-tls-cert # cert-manager writes the certificate here
  rules:
    # Public site (harbor — Next.js SSR/SSG). Apex + www.
    - host: yourdomain.com # ← replace
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor-svc
                port:
                  number: 80
    - host: www.yourdomain.com # ← replace
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor-svc
                port:
                  number: 80
    # Admin console (helm — React SPA). Its own subdomain.
    - host: app.yourdomain.com # ← replace
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
    # Backend REST API + WebSocket (Socket.io): the public role only. The
    # other roles and every ops port (9464: health, metrics) have no route here.
    - host: api.yourdomain.com # ← replace
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 3100
    # Browser RPC → backend RPC listener (:50051). The frontend's VITE_RPC_URL
    # points here (https://rpc.yourdomain.com). The backend serves gRPC,
    # gRPC-Web and the Connect protocol on that one port, and the browser uses
    # Connect over plain HTTP/1.1 requests, so the ingress proxies ordinary
    # HTTP: no gRPC backend-protocol annotation and no translating proxy.
    - host: rpc.yourdomain.com # ← replace
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 50051

# ⚠️ LOCAL KIND LEARNING ONLY — do NOT use in staging/production.
#
# Deploys Envoy into the kind cluster as the gRPC-Web ↔ gRPC translator between
# the browser and the backend. Mirrors infra/envoy/envoy.yaml, except the
# upstream cluster targets the in-cluster Service `backend-svc:50051` (via k8s
# DNS) instead of host.docker.internal.
#
# Apply:  kubectl apply -f infra/k8s/local-kind/envoy.yaml
# Reach:  kubectl port-forward svc/envoy-svc -n tropis 8090:8090
#         (the frontend calls gRPC-Web at localhost:8090 by default)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: tropis
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address: { address: 0.0.0.0, port_value: 8090 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              codec_type: auto
              stat_prefix: ingress_grpc_web
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: grpc_backend
                      timeout: 0s
                      max_stream_duration:
                        grpc_timeout_header_max: 0s
                  typed_per_filter_config:
                    envoy.filters.http.cors:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                      allow_origin_string_match:
                      - safe_regex:
                          regex: ".*"
                      allow_methods: GET, PUT, DELETE, POST, OPTIONS
                      allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization,x-request-id
                      max_age: "1728000"
                      expose_headers: grpc-status,grpc-message,grpc-encoding,grpc-accept-encoding
              http_filters:
              - name: envoy.filters.http.grpc_web
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
              - name: envoy.filters.http.cors
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: grpc_backend
        connect_timeout: 1s
        type: strict_dns
        dns_lookup_family: V4_ONLY
        http2_protocol_options: {}
        lb_policy: round_robin
        load_assignment:
          cluster_name: grpc_backend
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: backend-svc
                    port_value: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: tropis
  labels: { app: envoy }
spec:
  replicas: 1
  selector:
    matchLabels: { app: envoy }
  template:
    metadata:
      labels: { app: envoy }
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          args: ["-c", "/etc/envoy/envoy.yaml", "-l", "info"]
          ports:
            - containerPort: 8090
            - containerPort: 9901
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-svc
  namespace: tropis
spec:
  selector: { app: envoy }
  ports:
    - name: grpc-web
      port: 8090
      targetPort: 8090

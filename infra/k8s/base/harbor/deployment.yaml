apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor
  namespace: tropis
  labels:
    app: harbor
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: harbor
  template:
    metadata:
      labels:
        app: harbor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # "nextjs" user baked into the image
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: harbor
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: harbor
      containers:
        - name: harbor
          image: ghcr.io/tropis/harbor:latest # replace with your image
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4000 # Next.js standalone server (PORT=4000)
          # Lets the endpoint removal reach the ingress before Next stops.
          lifecycle:
            preStop:
              exec:
                command: ['sleep', '5']
          # Next writes ISR/fetch cache and temp files at runtime — mount
          # writable emptyDirs so the root filesystem can stay read-only.
          volumeMounts:
            - name: next-cache
              mountPath: /app/apps/frontend/harbor/.next/cache
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /
              port: 4000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            periodSeconds: 20
          resources:
            requests:
              cpu: '100m' # SSR needs more than static nginx (helm)
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '256Mi'
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tropis
  labels:
    app: backend
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001        # matches the numeric uid baked into the backend image
        runAsGroup: 1001
      containers:
        - name: backend
          image: ghcr.io/tropis/backend:latest  # replace with your image
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3100
              name: http
            - containerPort: 50051
              name: grpc
            # Internal gRPC tier — exposed only via backend-internal-svc
            # (ClusterIP) and NetworkPolicy-restricted to the namespace.
            - containerPort: 50061
              name: grpc-internal
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

# ══════════════════════════════════════════════════════════════════════════
# ⚠️  PLACEHOLDER SECRET — DO NOT USE IN PRODUCTION
#
# This file exists only so the manifests apply cleanly in dev clusters.
# In production, do NOT commit secret values to git. Instead use:
#   - External Secrets Operator (https://external-secrets.io) syncing from
#     Vault / AWS Secrets Manager / GCP Secret Manager, or
#   - HashiCorp Vault Agent injector, or Sealed Secrets.
#
# See docs/deployment.md for the recommended setup.
# ══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: tropis
type: Opaque
stringData:
  # Must be >= 32 chars — env.validation.ts enforces Joi.string().min(32),
  # so a shorter placeholder CrashLoops the backend on startup.
  JWT_SECRET: 'change_me_in_production_min_32_chars_long'
  REDIS_PASSWORD: ''
  CLICKHOUSE_PASSWORD: ''
  # Referenced by the backup CronJob (base/backup/cronjob.yaml).
  POSTGRES_PASSWORD: ''
  # JSON map {keyId: {secret, tenantId}}; '{}' turns the signed tier off. An
  # empty string fails validation.
  API_KEYS: '{}'
  # Empty: internal RPCs answer UNIMPLEMENTED.
  SERVICE_TOKEN: ''
  # Empty client id or secret: that OAuth provider stays unconfigured.
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''
  GITHUB_CLIENT_ID: ''
  GITHUB_CLIENT_SECRET: ''
  SMTP_USER: ''
  SMTP_PASS: ''
# In production: manage via Vault, Sealed Secrets, or External Secrets Operator.
# Never commit real values.

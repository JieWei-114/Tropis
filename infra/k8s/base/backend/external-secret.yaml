# ══════════════════════════════════════════════════════════════════════════
# OPTIONAL — External Secrets Operator (ESO) + Vault
#
# Replaces the placeholder backend/secret.yaml with a Secret synced from
# HashiCorp Vault (KV v2 mount `secret`, path `tropis` — the values seeded
# by infra/vault/init.sh).
#
# NOT included in the kustomization by default so `kubectl kustomize infra/k8s`
# works on clusters without ESO installed (these CRDs would fail to apply).
#
# How to enable:
#   1. Install ESO:
#        helm repo add external-secrets https://charts.external-secrets.io
#        helm install external-secrets external-secrets/external-secrets \
#          -n external-secrets --create-namespace
#   2. Create the Vault token secret referenced by the SecretStore below
#      (use an AppRole/Kubernetes-auth token in production, not the root token):
#        kubectl -n tropis create secret generic vault-token \
#          --from-literal=token=<vault-token-with-tropis-app-policy>
#   3. Swap the resource in infra/k8s/base/kustomization.yaml:
#        - remove:  backend/secret.yaml
#        - add:     backend/external-secret.yaml
#   4. Verify: kubectl -n tropis get externalsecret backend-secret
#      (status should be SecretSynced; the `backend-secret` Secret consumed by
#      the backend Deployment is created/refreshed automatically)
# ══════════════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: tropis
spec:
  provider:
    vault:
      # In-cluster Vault service address — adjust to your deployment
      server: http://vault.vault.svc.cluster.local:8200
      # KV v2 secrets engine mounted at `secret` (see infra/vault/init.sh)
      path: secret
      version: v2
      auth:
        # Simple token auth for dev; prefer Kubernetes auth in production
        tokenSecretRef:
          name: vault-token
          key: token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secret
  namespace: tropis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    # Same Secret name the backend Deployment's envFrom.secretRef consumes —
    # drop-in replacement for the placeholder backend/secret.yaml.
    name: backend-secret
    creationPolicy: Owner
  # Same keys as backend/secret.yaml. Every property must exist in Vault
  # (empty values are fine): one missing property fails the whole sync.
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: tropis # secret/data/tropis in Vault (KV v2)
        property: JWT_SECRET
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: tropis
        property: REDIS_PASSWORD
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: tropis
        property: CLICKHOUSE_PASSWORD
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: tropis
        property: POSTGRES_PASSWORD
    - secretKey: API_KEYS
      remoteRef:
        key: tropis
        property: API_KEYS
    - secretKey: SERVICE_TOKEN
      remoteRef:
        key: tropis
        property: SERVICE_TOKEN
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: tropis
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: tropis
        property: GOOGLE_CLIENT_SECRET
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: tropis
        property: GITHUB_CLIENT_ID
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: tropis
        property: GITHUB_CLIENT_SECRET
    - secretKey: SMTP_USER
      remoteRef:
        key: tropis
        property: SMTP_USER
    - secretKey: SMTP_PASS
      remoteRef:
        key: tropis
        property: SMTP_PASS

apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: tropis
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 3100
      targetPort: 3100
    - name: grpc
      port: 50051
      targetPort: 50051
---
# Internal gRPC tier — deliberately a SEPARATE Service so the public
# backend-svc can never accidentally route to the internal listener
# (e.g. via a mistaken port addition or ingress annotation). ClusterIP
# only; combined with NetworkPolicy (namespace-only ingress on 50061)
# and the x-service-token check in the app itself.
apiVersion: v1
kind: Service
metadata:
  name: backend-internal-svc
  namespace: tropis
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: grpc-internal
      port: 50061
      targetPort: 50061

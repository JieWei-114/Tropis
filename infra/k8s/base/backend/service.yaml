# Services exist only for the roles with an inbound API. Neither routes the
# ops port (9464); Prometheus scrapes pods directly.
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: tropis
spec:
  selector:
    app: backend-public
  ports:
    - name: http
      port: 3100
      targetPort: 3100
    - name: grpc
      port: 50051
      targetPort: 50051
---
# Internal RPC tier — a SEPARATE Service over the private role, so the public
# backend-svc can never route to the internal listener. ClusterIP only;
# combined with NetworkPolicy (namespace-only ingress on 50061) and the
# x-service-token check in the app itself.
apiVersion: v1
kind: Service
metadata:
  name: backend-internal-svc
  namespace: tropis
spec:
  type: ClusterIP
  selector:
    app: backend-private
  ports:
    - name: grpc-internal
      port: 50061
      targetPort: 50061

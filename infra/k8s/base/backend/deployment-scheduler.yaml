# backend-scheduler: Cron triggers only: each tick enqueues a job the worker runs, with a
# per-tick job id, so an overlapping second replica enqueues nothing extra.
# One replica and Recreate keep it to one process in the normal case.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-scheduler
  namespace: tropis
  labels:
    app: backend-scheduler
    component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend-scheduler
  template:
    metadata:
      labels:
        app: backend-scheduler
        component: backend
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9464'
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # matches the numeric uid baked into the backend images
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/tropis/backend-scheduler:latest # docker build --target scheduler
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            # Ops listener: /livez, /readyz, /metrics. No Service or ingress routes it.
            - containerPort: 9464
              name: ops
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          # Readiness: this role's dependency probes. Liveness: the process
          # only, so a dependency outage never restarts the pod.
          # The ops listener opens once boot finishes (connection retries can
          # take minutes), so the startup probe holds liveness off for up to
          # 180s instead of a fixed initial delay.
          startupProbe:
            httpGet:
              path: /livez
              port: ops
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: ops
            periodSeconds: 20
          resources:
            requests:
              cpu: '25m'
              memory: '96Mi'
            limits:
              cpu: '200m'
              memory: '256Mi'

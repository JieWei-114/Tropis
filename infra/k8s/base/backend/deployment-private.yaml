# backend-private: Internal-tier RPC listener only. Reached through backend-internal-svc
# (ClusterIP), NetworkPolicy-restricted to pods labelled
# tropis.io/internal-rpc-client: "true"; never via ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-private
  namespace: tropis
  labels:
    app: backend-private
    component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: backend-private
  template:
    metadata:
      labels:
        app: backend-private
        component: backend
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9464'
        prometheus.io/path: /metrics
    spec:
      # preStop (5s) lets the endpoint removal reach every proxy before
      # SIGTERM; then the app stops accepting and drains in-flight calls (at
      # most 10s, DRAIN_TIMEOUT_MS) before it tears down connections.
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # matches the numeric uid baked into the backend images
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend-private
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend-private
      containers:
        - name: backend
          image: ghcr.io/tropis/backend-private:latest # docker build --target private
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 50061
              name: grpc-internal
            # Ops listener: /livez, /readyz, /metrics. No Service or ingress routes it.
            - containerPort: 9464
              name: ops
          lifecycle:
            preStop:
              exec:
                command: ['sleep', '5']
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          # Readiness: this role's dependency probes. Liveness: the process
          # only, so a dependency outage never restarts the pod.
          # The ops listener opens once boot finishes (connection retries can
          # take minutes), so the startup probe holds liveness off for up to
          # 180s instead of a fixed initial delay.
          startupProbe:
            httpGet:
              path: /livez
              port: ops
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: ops
            periodSeconds: 20
          resources:
            requests:
              cpu: '50m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'

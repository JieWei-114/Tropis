# Envoy — gRPC-Web ↔ gRPC translator between the browser and the backend.
# The browser speaks gRPC-Web (HTTP/1.1); the NestJS backend speaks gRPC
# (HTTP/2). Every env needs this on the gRPC-Web path — the ingress routes the
# browser's gRPC-Web host here, and Envoy forwards to backend-svc:50051.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: tropis
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address: { address: 0.0.0.0, port_value: 8090 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              codec_type: auto
              stat_prefix: ingress_grpc_web
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: grpc_backend
                      timeout: 0s
                      max_stream_duration:
                        grpc_timeout_header_max: 0s
                  typed_per_filter_config:
                    envoy.filters.http.cors:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                      # Pinned origins. A ".*" wildcard here lets ANY page a
                      # victim visits script authenticated gRPC-Web calls
                      # against this tier and read the responses.
                      # BEFORE DEPLOYING, uncomment the production entries and
                      # replace `yourdomain.com` with the real apex domain —
                      # same placeholder convention as overlays/*/ingress.yaml.
                      # Envoy does not expand env vars in its static bootstrap,
                      # so this ConfigMap is the only place to set them. Leaving
                      # them commented means production browser calls are
                      # rejected by CORS (fail-closed), not silently allowed.
                      allow_origin_string_match:
                      # --- local development ---
                      - exact: "http://localhost:5173" # helm console (vite dev)
                      - exact: "http://localhost:4173" # helm console (vite preview)
                      - exact: "http://localhost:3000" # harbor site (next dev)
                      # --- packaged clients (fixed custom schemes, not deployment
                      #     settings): the Tauri desktop shell and the two Capacitor
                      #     apps do not serve from a network origin, so without these
                      #     every gRPC-Web call from them is blocked and each app
                      #     fails at sign-in ---
                      - exact: "tauri://localhost" # desktop (macOS, Linux)
                      - exact: "http://tauri.localhost" # desktop (Windows)
                      - exact: "capacitor://localhost" # iOS
                      - exact: "http://localhost" # Android (default scheme)
                      - exact: "https://localhost" # Android (androidScheme: https)
                      # --- production: uncomment and replace before deploying ---
                      # - exact: "https://app.yourdomain.com" # ← replace (helm console)
                      # - exact: "https://yourdomain.com" # ← replace (harbor site, apex)
                      # - exact: "https://www.yourdomain.com" # ← replace (harbor site, www)
                      allow_methods: GET, PUT, DELETE, POST, OPTIONS
                      allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization,x-request-id,x-tenant-id
                      max_age: "1728000"
                      expose_headers: grpc-status,grpc-message,grpc-encoding,grpc-accept-encoding
              http_filters:
              - name: envoy.filters.http.grpc_web
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
              - name: envoy.filters.http.cors
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: grpc_backend
        connect_timeout: 1s
        type: strict_dns
        dns_lookup_family: V4_ONLY
        http2_protocol_options: {}
        lb_policy: round_robin
        load_assignment:
          cluster_name: grpc_backend
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: backend-svc
                    port_value: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: tropis
  labels: { app: envoy }
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels: { app: envoy }
  template:
    metadata:
      labels: { app: envoy }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # "envoy" user in the envoyproxy image
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          args: ['-c', '/etc/envoy/envoy.yaml', '-l', 'info']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8090
            - containerPort: 9901
          readinessProbe:
            httpGet: { path: /ready, port: 9901 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: '50m', memory: '64Mi' }
            limits: { cpu: '500m', memory: '256Mi' }
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-svc
  namespace: tropis
spec:
  selector: { app: envoy }
  ports:
    - name: grpc-web
      port: 8090
      targetPort: 8090

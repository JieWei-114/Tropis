apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: tropis
  labels:
    app: opa
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: opa
      containers:
        - name: opa
          image: ghcr.io/tropis/opa:latest
          ports:
            - name: http
              containerPort: 8181
          env:
            - name: OPA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: OPA_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']

# Tauri desktop shell — an app shell around the built frontend, NOT a backend
# service, so it is intentionally its own standalone crate (the [workspace]
# table below detaches it from the root Cargo workspace, which holds the
# services under services/).
[package]
name = "tropis-desktop"
version = "0.1.0"
description = "Tropis desktop shell (Tauri v2)"
edition = "2021"

[workspace]

[lib]
name = "tropis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.2.0"
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-opener = "2.7.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }

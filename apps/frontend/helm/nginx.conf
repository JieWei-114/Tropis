server {
    # 8080 so nginx can run as a non-root user (ports <1024 need root)
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (Lighthouse "Best Practices" + hardening) ──────────
    # `always` so they're sent on error responses too. nginx does NOT inherit
    # server-level add_header into a location that declares its own — hence the
    # /assets/ block repeats all of them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;                 # clickjacking
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content-Security-Policy. The theme bootstrap in index.html is the only
    # inline script and is allowed by its hash; scripts/render-nginx-conf.mjs
    # fails the image build when that hash no longer matches, and replaces
    # __CSP_CONNECT_SRC__ with the API, RPC and realtime origins the build was
    # made for. style-src keeps 'unsafe-inline' for the <style> elements the
    # dialog scroll lock injects at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2VPKlkmNoy5g9JPxfHbDRyY4Z8DgNynB3uh6o1Jlhp4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' __CSP_CONNECT_SRC__; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2VPKlkmNoy5g9JPxfHbDRyY4Z8DgNynB3uh6o1Jlhp4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' __CSP_CONNECT_SRC__; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # SPA fallback — client-side routing
    location / {
        try_files $uri /index.html;
    }
}

name: Deploy — Production

# Triggers on a semver tag push (e.g. v1.2.3)
# Workflow: CI must pass first, then this job builds + pushes images and deploys to K8s
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io # GitHub Container Registry — free for public repos

permissions:
  contents: read

# One production deploy at a time; a newer tag waits instead of racing.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # ── Gate: the tagged commit must pass the core checks before we build/deploy.
  # Prevents a `v*` tag on broken code from shipping to prod.
  verify:
    name: Verify (lint · type · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @tropis/shared build
      - name: Lint
        run: pnpm -r lint
      - name: Type check (backend)
        run: pnpm exec tsc --noEmit
        working-directory: apps/backend
      - name: Unit tests (backend)
        run: pnpm --filter @tropis/backend test
      - name: Build all
        run: pnpm -r build

  deploy:
    name: Build, push, deploy
    needs: verify # ← deploy only runs if verify (CI gate) passed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ── Image tag from git tag (e.g. v1.2.3) ──────────────────────────
      - name: Extract version tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Registry paths must be lowercase; github.repository keeps the owner's
      # and the repository's case.
      - name: Image names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          {
            echo "IMAGE_BACKEND=${REGISTRY}/${repo}/backend"
            echo "IMAGE_FRONTEND=${REGISTRY}/${repo}/frontend"
            echo "IMAGE_HARBOR=${REGISTRY}/${repo}/harbor"
            echo "IMAGE_OPA=${REGISTRY}/${repo}/opa"
          } >> "$GITHUB_ENV"

      # ── Log in to GitHub Container Registry ───────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build + push backend ───────────────────────────────────────────
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push the backend role images
        run: |
          for role in public private worker scheduler; do
            docker buildx build . \
              --file apps/backend/Dockerfile \
              --target "$role" \
              --tag "${{ env.IMAGE_BACKEND }}-$role:${{ steps.tag.outputs.version }}" \
              --tag "${{ env.IMAGE_BACKEND }}-$role:latest" \
              --push
          done

      # ── Build + push frontend ──────────────────────────────────────────
      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: . # repo root — Dockerfile needs the pnpm workspace
          file: apps/frontend/helm/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_FRONTEND }}:latest
          # Vite bakes these into the static bundle. They are public URLs, so
          # they come from repository variables (Settings → Variables → Actions).
          # VITE_SITE_URL is the console's own origin (its canonical/OG URLs),
          # which is the same URL harbor links to as the console.
          build-args: |
            VITE_API_BASE_URL=${{ vars.PROD_API_BASE_URL }}
            VITE_RPC_URL=${{ vars.PROD_RPC_URL }}
            VITE_WS_URL=${{ vars.PROD_WS_URL }}
            VITE_SITE_URL=${{ vars.PROD_CONSOLE_URL }}
            VITE_TENANT_ID=${{ vars.PROD_TENANT_ID }}

      # ── Build + push harbor (public Next.js SSR site) ──────────────────
      - name: Build and push harbor image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: . # repo root — Dockerfile needs the pnpm workspace
          file: apps/frontend/harbor/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_HARBOR }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_HARBOR }}:latest
          # Next.js prerenders pages with these, so they are fixed per image.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.PROD_SITE_URL }}
            NEXT_PUBLIC_CONSOLE_URL=${{ vars.PROD_CONSOLE_URL }}

      # ── Build + push OPA (policy engine with the tested policies) ──────
      - name: Build and push OPA image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/opa/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_OPA }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_OPA }}:latest

      # ── Deploy to Kubernetes ───────────────────────────────────────────
      # Requires a KUBE_CONFIG secret in repo settings:
      #   Settings → Secrets → Actions → KUBE_CONFIG
      #   Value: base64-encoded kubeconfig (kubectl config view --raw | base64)
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Pin image tags and SERVICE_VERSION in the Kustomize overlay
        working-directory: infra/k8s/overlays/prod
        run: |
          for role in public private worker scheduler; do
            kustomize edit set image \
              ghcr.io/tropis/backend-$role=${{ env.IMAGE_BACKEND }}-$role:${{ steps.tag.outputs.version }}
          done
          kustomize edit set image \
            ghcr.io/tropis/frontend=${{ env.IMAGE_FRONTEND }}:${{ steps.tag.outputs.version }}
          kustomize edit set image \
            ghcr.io/tropis/harbor=${{ env.IMAGE_HARBOR }}:${{ steps.tag.outputs.version }}
          kustomize edit set image \
            ghcr.io/tropis/opa=${{ env.IMAGE_OPA }}:${{ steps.tag.outputs.version }}
          kustomize edit set configmap backend-config --namespace tropis \
            --from-literal=SERVICE_VERSION=${{ steps.tag.outputs.version }}

      # ── GitOps alternative (Argo CD) ───────────────────────────────────
      # For true GitOps, don't kubectl apply from CI. Instead COMMIT the
      # kustomization image-tag change back to the repo and let Argo CD
      # (infra/argocd/app-prod.yaml) detect + sync it. To switch:
      #   1. Uncomment the step below.
      #   2. Delete/comment the kubectl steps (Set up kubeconfig, Install
      #      kubectl, Apply prod overlay, Wait for rollout, Rollback).
      #   3. Change `contents: read` to `contents: write` in job permissions.
      # - name: Commit image tag bump (GitOps — Argo CD syncs it)
      #   run: |
      #     git config user.name  "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git fetch origin main
      #     git checkout main
      #     git add infra/k8s/overlays/prod/kustomization.yaml
      #     git commit -m "chore(deploy): pin images to ${{ steps.tag.outputs.version }} [skip ci]"
      #     git push origin main

      # ── Fallback: direct kubectl deploy (non-GitOps path) ──────────────
      - name: Apply prod overlay
        run: kubectl apply -k infra/k8s/overlays/prod

      - name: Wait for rollout
        id: rollout
        run: |
          for role in public private worker scheduler; do
            kubectl rollout status deployment/backend-$role -n tropis --timeout=180s
          done
          kubectl rollout status deployment/frontend -n tropis --timeout=60s
          kubectl rollout status deployment/harbor   -n tropis --timeout=90s
          kubectl rollout status deployment/opa      -n tropis --timeout=60s

      # If the rollout fails, revert every deployment to the previous
      # revision and fail the job so the broken tag is flagged.
      - name: Rollback on rollout failure
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          echo "Rollout failed — rolling back to previous revision"
          for role in public private worker scheduler; do
            kubectl rollout undo deployment/backend-$role -n tropis
          done
          kubectl rollout undo deployment/frontend -n tropis
          kubectl rollout undo deployment/harbor   -n tropis
          kubectl rollout undo deployment/opa      -n tropis || true # no earlier revision on the first deploy
          for role in public private worker scheduler; do
            kubectl rollout status deployment/backend-$role -n tropis --timeout=180s
          done
          kubectl rollout status deployment/frontend -n tropis --timeout=60s
          kubectl rollout status deployment/harbor   -n tropis --timeout=90s
          exit 1

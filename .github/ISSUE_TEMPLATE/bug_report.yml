name: Bug report
description: Something is broken — a defect in existing behavior
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check [docs/troubleshooting.md](../../blob/main/docs/troubleshooting.md) for known local-dev issues.
        **Security issues must NOT be reported here** — see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: The WebSocket connection drops after login when...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. `make up && make dev`
        2. Log in as the seeded admin
        3. Open the users page
        4. Observe the error in the console
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual behavior
      description: What you expected to happen, and what actually happened.
      placeholder: |
        **Expected:** ...
        **Actual:** ...
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Docker compose profile
      description: Which compose profile(s) were running?
      options:
        - core (make up)
        - core + analytics (make up-analytics)
        - core + observability (make up-obs)
        - core + tools (make up-tools)
        - full stack (make up-all)
        - none / not applicable
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: If frontend-related — browser and version.
      placeholder: Chrome 128, Firefox 130, n/a
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v20.17.0
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Backend/worker logs, browser console output, or stack traces. Automatically formatted as code.
      render: shell
  - type: checkboxes
    id: regression-test
    attributes:
      label: Regression test
      description: Per docs/testing.md and CONTRIBUTING.md — every bug fix must include a repro test that fails without the fix.
      options:
        - label: I understand the fix for this bug must ship with a regression test that fails without the fix (bug-first-repro-test rule, docs/testing.md).
          required: true

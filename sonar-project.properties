sonar.projectKey=tropis
sonar.projectName=tropis
sonar.projectVersion=1.0

# Fail the CI scan (and the sonarcloud job) when the quality gate fails
sonar.qualitygate.wait=true

# Source roots — packages/sdk included (its gen/ output is excluded below);
# e2e/ is Playwright test code, intentionally left out of analysis.
sonar.sources=apps/backend/src,frontend/helm/src,packages/shared/src,packages/sdk/src
sonar.tests=apps/backend/src
sonar.test.inclusions=**/*.spec.ts

# Exclusions — generated code (**/gen/** = proto/gRPC stubs), build output,
# coverage reports, config, and declaration files
sonar.exclusions=\
  **/node_modules/**,\
  **/gen/**,\
  **/dist/**,\
  **/coverage/**,\
  e2e/**,\
  **/*.module.ts,\
  **/main.ts,\
  **/tracing.ts,\
  **/*.dto.ts,\
  **/*.schema.ts,\
  **/*.interface.ts,\
  **/*.constants.ts

# Coverage — Jest LCOV report; keep generated/build/test artifacts out
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info
sonar.coverage.exclusions=\
  **/gen/**,\
  **/dist/**,\
  **/coverage/**,\
  e2e/**

# TypeScript
sonar.typescript.tsconfigPath=apps/backend/tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

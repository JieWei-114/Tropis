syntax = "proto3";

package tropis.auth.v1;

// ── Auth ──────────────────────────────────────────────────────────────────────
service AuthService {
  rpc Login          (LoginRequest)  returns (LoginResponse);
  rpc GetCurrentUser (EmptyRequest)  returns (CurrentUserResponse);
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
}

message EmptyRequest {}

// Not used by any RPC: protected calls carry the token in the Authorization
// header (Authorization: Bearer <jwt>). Kept so the message name stays
// resolvable for clients generated from older contracts.
message TokenRequest {
  option deprecated = true;
  string token = 1;
}

message CurrentUserResponse {
  string user_id = 1;
  string email   = 2;
}
